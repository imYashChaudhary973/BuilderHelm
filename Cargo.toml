[workspace]
resolver = "2"
members = [
  "crates/helm-shared",
  "crates/helm-observability",
  "crates/helm-protocol",
  "crates/helm-db",
  "crates/helm-gateway",
  "crates/helm-tools",
  "crates/helm-core",
  "crates/helm-swarm",
  "crates/helm-pty",
  "crates/helm-host",
  "crates/helm-ui",
  "crates/helm-app",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
iced = "0.14.0"
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"
cosmic-text = "0.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
keyring = "4.1.6"
rfd = "0.17.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.25.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
helm-shared = { path = "crates/helm-shared" }
helm-protocol = { path = "crates/helm-protocol" }
