[package]
name = "helm-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
helm-db = { path = "../helm-db" }
helm-gateway = { path = "../helm-gateway" }
helm-observability = { path = "../helm-observability" }
helm-protocol.workspace = true
helm-shared.workspace = true
helm-tools = { path = "../helm-tools" }
keyring.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing", "local-offset"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "time"] }
uuid.workspace = true

[dev-dependencies]
helm-db = { path = "../helm-db" }
helm-gateway = { path = "../helm-gateway" }
helm-observability = { path = "../helm-observability" }
helm-protocol.workspace = true
helm-shared.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
