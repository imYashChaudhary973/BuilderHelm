[package]
name = "helm-swarm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
helm-core = { path = "../helm-core" }
helm-db = { path = "../helm-db" }
helm-observability = { path = "../helm-observability" }
helm-protocol.workspace = true
helm-shared.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
